<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC AI Pulse - Anlık Alım/Satım Sinyalleri</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      border: 1px solid #334155;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .price {
      font-size: 1.4rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .badge {
      display: block;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      text-align: center;
      margin: 15px 0;
    }
    .GÜÇLÜ-AL, .AL { background-color: #16a34a; color: white; }
    .GÜÇLÜ-SAT, .SAT { background-color: #dc2626; color: white; }
    .NÖTR { background-color: #eab308; color: black; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 0.95rem;
    }
    .sentiment-box {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 10px;
      margin: 12px 0;
      border: 1px dashed #475569;
    }
    .signals-list {
      margin-top: 12px;
      padding-left: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2 id="coin-title">BTC/USDT</h2>
      <div id="coin-price" class="price">Yükleniyor...</div>
    </div>

    <div id="decision-badge" class="badge NÖTR">Analiz Ediliyor...</div>

    <!-- Duygu Analizi (Fear & Greed Index) Kısımı -->
    <div class="sentiment-box">
      <div class="stat-row" style="margin:0;">
        <span>Piyasa Duygu Havası:</span>
        <strong id="fng-val">Yükleniyor...</strong>
      </div>
    </div>

    <div class="stat-row">
      <span>AI Sinyal Skoru:</span>
      <strong id="score-val">-</strong>
    </div>
    <div class="stat-row">
      <span>RSI (14):</span>
      <strong id="rsi-val">-</strong>
    </div>
    <div class="stat-row">
      <span>Anlık Destek:</span>
      <strong id="support-val">-</strong>
    </div>
    <div class="stat-row">
      <span>Anlık Direnç:</span>
      <strong id="resistance-val">-</strong>
    </div>

    <h4>Sinyal Gerekçeleri:</h4>
    <ul id="signals-list" class="signals-list">
      <li>Veriler çekiliyor...</li>
    </ul>

    <button onclick="calculateSignals()">Sinyalleri Yenile</button>
  </div>

  <script>
    function calculateRSI(prices, period = 14) {
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        let diff = prices[i] - prices[i - 1];
        if (diff >= 0) gains += diff;
        else losses -= diff;
      }
      let avgGain = gains / period;
      let avgLoss = losses / period;

      for (let i = period + 1; i < prices.length; i++) {
        let diff = prices[i] - prices[i - 1];
        if (diff >= 0) {
          avgGain = (avgGain * (period - 1) + diff) / period;
          avgLoss = (avgLoss * (period - 1)) / period;
        } else {
          avgGain = (avgGain * (period - 1)) / period;
          avgLoss = (avgLoss * (period - 1) - diff) / period;
        }
      }
      if (avgLoss === 0) return 100;
      let rs = avgGain / avgLoss;
      return 100 - (100 / (1 + rs));
    }

    // Fear & Greed Index Çekme Fonksiyonu
    async function fetchFearAndGreed() {
      try {
        const res = await fetch('https://api.alternative.me/fng/');
        const data = await res.json();
        const item = data.data[0];
        
        // Türkçe Çeviriler
        let valueText = item.value_classification;
        if (valueText === "Extreme Fear") valueText = "Aşırı Korku 😱";
        else if (valueText === "Fear") valueText = "Korku 😨";
        else if (valueText === "Neutral") valueText = "Nötr 😐";
        else if (valueText === "Greed") valueText = "Açgözlülük 😏";
        else if (valueText === "Extreme Greed") valueText = "Aşırı Açgözlülük 🚀";

        document.getElementById('fng-val').innerText = `${item.value}/100 (${valueText})`;
        return parseInt(item.value);
      } catch (e) {
        document.getElementById('fng-val').innerText = "Veri Alınamadı";
        return 50;
      }
    }

    async function calculateSignals(symbol = 'BTCUSDT') {
      try {
        // Duygu Endeksini Al
        const fngScore = await fetchFearAndGreed();

        // Binance Verisini Al
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=100`);
        const data = await res.json();

        const closePrices = data.map(c => parseFloat(c[4]));
        const currentPrice = closePrices[closePrices.length - 1];

        const rsi = calculateRSI(closePrices, 14);

        const recent20 = closePrices.slice(-20);
        const support = Math.min(...recent20);
        const resistance = Math.max(...recent20);

        let score = 50;
        let signals = [];

        // Fear & Greed Katkısı
        if (fngScore < 25) {
          score += 10;
          signals.push("Piyasada Aşırı Korku Var (Tarihsel Dip / Alım Fırsatı Olabilir)");
        } else if (fngScore > 75) {
          score -= 10;
          signals.push("Piyasada Aşırı Açgözlülük Var (Düzeltme Riski Yüksek)");
        }

        // RSI Katkısı
        if (rsi < 30) {
          score += 25;
          signals.push("RSI Aşırı Satım Bölgesinde (Dip seviyede)");
        } else if (rsi > 70) {
          score -= 25;
          signals.push("RSI Aşırı Alım Bölgesinde (Kar Satışı Riski)");
        } else {
          signals.push("RSI Dengeli Bölgede (30 - 70 arası)");
        }

        // Destek & Direnç Katkısı
        if (currentPrice <= support * 1.002) {
          score += 15;
          signals.push("Fiyat anlık desteğe çok yakın");
        }
        if (currentPrice >= resistance * 0.998) {
          score -= 15;
          signals.push("Fiyat anlık direnç bölgesinde");
        }

        let decision = "NÖTR / TUT";
        if (score >= 70) decision = "GÜÇLÜ AL";
        else if (score > 55) decision = "AL";
        else if (score <= 30) decision = "GÜÇLÜ SAT";
        else if (score < 45) decision = "SAT";

        // Arayüz Güncelleme
        document.getElementById('coin-title').innerText = `${symbol}`;
        document.getElementById('coin-price').innerText = `$${currentPrice.toLocaleString('en-US')}`;
        
        const badge = document.getElementById('decision-badge');
        badge.innerText = decision;
        badge.className = `badge ${decision.replace(' ', '-')}`;

        document.getElementById('score-val').innerText = `%${score}`;
        document.getElementById('rsi-val').innerText = rsi.toFixed(2);
        document.getElementById('support-val').innerText = `$${support.toLocaleString('en-US')}`;
        document.getElementById('resistance-val').innerText = `$${resistance.toLocaleString('en-US')}`;

        const list = document.getElementById('signals-list');
        list.innerHTML = '';
        signals.forEach(sig => {
          const li = document.createElement('li');
          li.innerText = sig;
          list.appendChild(li);
        });

      } catch (err) {
        console.error("Veri hatası:", err);
      }
    }

    calculateSignals();
  </script>
</body>
</html>
