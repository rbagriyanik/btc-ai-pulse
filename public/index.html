<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto AI Pulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 py-4 mb-6 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚡</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Crypto AI Pulse</h1>
          <p class="text-xs text-slate-400">Yapay Zeka Destekli Canlı Bitcoin Analizi & Sinyaller</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 space-y-6">

    <!-- Live TradingView Chart -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <h3 class="text-sm font-semibold text-slate-300 mb-3 px-2">📈 Canlı TradingView BTC/USDT Grafiği</h3>
      <div class="w-full h-[500px] rounded-xl overflow-hidden">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div id="tradingview_chart" style="height:calc(100% - 32px);width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "60",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "tr",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_chart"
          });
          </script>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
