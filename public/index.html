<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC AI Pulse - Anlık Sinyaller</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 360px;
      border: 1px solid #334155;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      margin: 10px 0;
    }
    .GÜÇLÜ-AL, .AL { background-color: #16a34a; color: white; }
    .GÜÇLÜ-SAT, .SAT { background-color: #dc2626; color: white; }
    .NÖTR { background-color: #eab308; color: black; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 0.95rem;
    }
    .signals-list {
      margin-top: 12px;
      padding-left: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2 id="coin-title">BTC/USDT</h2>
      <div id="coin-price" class="price">Yükleniyor...</div>
    </div>

    <div style="text-align: center;">
      <div id="decision-badge" class="badge NÖTR">Lütfen bekleyin...</div>
    </div>

    <div class="stat-row">
      <span>AI Güven Skoru:</span>
      <strong id="score-val">-</strong>
    </div>
    <div class="stat-row">
      <span>RSI (14):</span>
      <strong id="rsi-val">-</strong>
    </div>
    <div class="stat-row">
      <span>Anlık Destek:</span>
      <strong id="support-val">-</strong>
    </div>
    <div class="stat-row">
      <span>Anlık Direnç:</span>
      <strong id="resistance-val">-</strong>
    </div>

    <h4>Sinyal Detayları:</h4>
    <ul id="signals-list" class="signals-list">
      <li>Veri bekleniyor...</li>
    </ul>

    <button onclick="fetchAnalysis()">Sinyalleri Yenile</button>
  </div>

  <script>
    async function fetchAnalysis(symbol = 'BTCUSDT') {
      try {
        const response = await fetch(`/api/analysis/${symbol}`);
        const data = await response.json();

        document.getElementById('coin-title').innerText = `${data.symbol}`;
        document.getElementById('coin-price').innerText = `$${data.currentPrice}`;
        
        const badge = document.getElementById('decision-badge');
        badge.innerText = data.decision;
        badge.className = `badge ${data.decision.replace(' ', '-')}`;

        document.getElementById('score-val').innerText = `%${data.score}`;
        document.getElementById('rsi-val').innerText = data.rsi;
        document.getElementById('support-val').innerText = `$${data.support}`;
        document.getElementById('resistance-val').innerText = `$${data.resistance}`;

        const list = document.getElementById('signals-list');
        list.innerHTML = '';
        if (data.signals.length === 0) {
          list.innerHTML = '<li>Net bir aşırı alım/satım sinyali yok.</li>';
        } else {
          data.signals.forEach(sig => {
            const li = document.createElement('li');
            li.innerText = sig;
            list.appendChild(li);
          });
        }
      } catch (err) {
        console.error("Analiz verisi çekilemedi:", err);
      }
    }

    // Sayfa açıldığında otomatik çalıştır
    fetchAnalysis();
  </script>
</body>
</html>
